name: release

# Builds the two things a user actually downloads -- the Android APK and a packaged Windows
# client -- and attaches them to a GitHub Release. Build outputs are not committed to the
# repository; this is where they come from.
#
# Runs on a version tag, or by hand from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed by `gh release create` in the publish job. Nothing else writes.
permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Committed from Windows, so the executable bit does not survive.
      - name: Make the wrapper executable
        run: chmod +x android/gradlew

      # The vectors are generated from beamer-vigem by the Python side; the Kotlin tests assert
      # the transcription against them, which is the check that the two ends agree.
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      # Lint, because the unit tests run on a desktop JVM and cannot see an API the phone lacks.
      # It is how three crashes were found that every test here had passed: BigInteger.TWO
      # (Android 13+) in the crypto, windowInsetsController (Android 11+) in onCreate, and a
      # missing VIBRATE permission that silently disabled rumble.
      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Build the APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Name it after the tag
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/CaptureKVM-${GITHUB_REF_NAME:-dev}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r windows/requirements.txt

      # The fork's own tests and the client against its real responder. Worth running here
      # because a packaged build that starts but cannot link is worse than no build.
      - name: Gamepad and responder tests
        working-directory: beamer-vigem
        run: python -m unittest core.tests.test_gamepad core.tests.test_responder_gamepad

      - name: Client unit tests
        working-directory: windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: End-to-end check
        run: python tools/end_to_end_check.py

      # Builds the real window and asks it. Fullscreen that keeps the toolbar is not a crash and
      # no unit test sees it; it just quietly stops being fullscreen, which is how it shipped.
      - name: Fullscreen check
        run: python tools/fullscreen_check.py

      # The installer compiler, the same pinned file as on a developer's PC, installed for this
      # user only: Inno Setup 6.7.4, signed by Pyrsys B.V.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.4.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile $setup
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash
          if ($hash -ne "A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C") { throw "Inno Setup's SHA-256 is $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "innosetup"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NOICONS", "/NORESTART", "/SP-", "/DIR=`"$dir`"" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup did not install" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      # build.ps1 rather than pyinstaller on its own: it fetches ViGEm's files, loads every module
      # of both modes back out of the finished exe, checks ViGEmClient.dll is in it, and compiles
      # the installer. A windowed exe missing a module shows no window and logs nothing, so a build
      # that packaged cleanly can still be dead on arrival, and CI is the last place to notice.
      - name: Package
        shell: pwsh
        working-directory: windows
        run: ./build.ps1 -Python python -Installer

      # Install it, look, uninstall it, on a machine nobody has used. Silently, as a receiver, so
      # nothing asks for administrator permission; the host's firewall and driver steps cannot be
      # exercised here without a person to answer Windows's prompts.
      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem windows/dist/CaptureKVM-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "ckvm-install-test"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/ROLE=receiver", "/DIR=`"$dir`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          foreach ($file in "CaptureKVM.exe", "_internal\ViGEmClient.dll", "host-firewall.ps1", "unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "$file was not installed" }
          }
          $config = Get-Content (Join-Path $env:APPDATA "CaptureKVM\config.json") -Raw | ConvertFrom-Json
          if ($config.mode -ne "receiver") { throw "the role page's answer was not recorded: mode is '$($config.mode)'" }
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          foreach ($link in "CaptureKVM.lnk", "CaptureKVM - change mode.lnk") {
            if (-not (Test-Path (Join-Path $menu $link))) { throw "no Start menu entry $link" }
          }
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # The uninstaller copies itself away and carries on, so wait for its work, not for it.
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path (Join-Path $dir "CaptureKVM.exe")) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if (Test-Path (Join-Path $dir "CaptureKVM.exe")) { throw "the uninstaller left CaptureKVM.exe behind" }
          if (Test-Path (Join-Path $menu "CaptureKVM.lnk")) { throw "the uninstaller left the Start menu entry" }
          Write-Host "installed, recorded the role, made both Start menu entries, and uninstalled cleanly"

      - name: Name the installer
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem windows/dist/CaptureKVM-Setup-*.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/CaptureKVM-$tag-windows-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [android, windows]
    runs-on: ubuntu-latest
    # Only a tag makes a release; a manual run just leaves the artifacts on the run.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh assets
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CaptureKVM $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "
          **Android** — sideload the APK. It is debug-signed, so Android will warn about an unknown source.
          Needs USB host (OTG) and Android 8.0+.

          **Upgrading on Android: uninstall the old version first.** Each release so far has been signed with
          a different key, and Android refuses to install over an app signed with another one — it just says
          \"App not installed\". Uninstalling clears the app's storage, so you will need to pair with the PC again.

          **Windows** — run \`CaptureKVM-$GITHUB_REF_NAME-windows-setup.exe\`. It installs for your user only, with
          no administrator permission. Unsigned, so SmartScreen will warn: More info, then Run anyway.

          One app is **both** ends of the link, and the installer asks which this machine is:

          - **receiver** — the machine the capture card is plugged into: shows the PC and drives it.
          - **host** — the PC being watched: takes the keyboard, mouse and controller, the controller through
            a virtual Xbox pad. This is the bundled Beamer fork's own window. On this PC the installer also
            offers to open Windows Firewall for the laptop or tablet, and to install the ViGEmBus controller
            driver if it is missing; each asks for administrator permission through Windows's own prompt.

          So run the same installer on both machines and answer differently. To change the answer later:
          **CaptureKVM - change mode** in the Start menu, or *Mode…* in the receiver's toolbar. If an older
          Beamer is installed on the PC, close it first, or the two will both try to drive the controller.

          The APK is the receiver end only; it needs a PC running CaptureKVM in host mode, or stock Beamer
          without the pad.
          "
